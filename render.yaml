services:
  - type: web
    name: terrasketch-api
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      - key: SKIP_TERRAFORM_VALIDATE
        value: "true"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: APP_ENV
        value: production
      - key: RATE_LIMIT_GENERATE
        value: 5/minute
      - key: DATABASE_URL
        fromDatabase:
          name: terrasketch-db
          property: connectionString

databases:
  - name: terrasketch-db
    plan: free
    databaseName: terrasketch
    user: terrasketch
